<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | عطور الفخامة</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark: #111111;
            --light: #f9f9f9;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        h1 { color: var(--gold); }
        .box-section {
            background: #252525;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .options {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        button {
            background: #333;
            color: var(--light);
            border: 1px solid var(--gold);
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button.selected {
            background: var(--gold);
            color: var(--dark);
        }
        .order-btn {
            background: #25D366;
            color: white;
            border: none;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AURA PERFUMES</h1>
        <p>اختر بوكس العطور الخاص بك بكل فخامة</p>

        <!-- البوكس الرجالي -->
        <div class="box-section">
            <h3>البوكس الرجالي (3 × 15 مل)</h3>
            <p>اختر 3 عطور مفضلة لديك:</p>
            <div class="options">
                <button onclick="toggleSelect(this)">Sauvage</button>
                <button onclick="toggleSelect(this)">Aventus</button>
                <button onclick="toggleSelect(this)">Royal Oud</button>
                <button onclick="toggleSelect(this)">Black Dakkar</button>
            </div>
        </div>

        <!-- البوكس النسائي -->
        <div class="box-section">
            <h3>البوكس النسائي (3 × 15 مل)</h3>
            <p>التشكيلة الثابتة: Libre, Good Girl, AURA Femme Signature</p>
        </div>

        <button class="order-btn" onclick="sendOrder()">تأكيد الطلب عبر الواتساب</button>
    </div>

    <script>
        let selectedPerfumes = [];
        
        function toggleSelect(btn) {
            btn.classList.toggle('selected');
            let name = btn.innerText;
            if(btn.classList.contains('selected')) {
                if(!selectedPerfumes.includes(name)) selectedPerfumes.push(name);
            } else {
                selectedPerfumes = selectedPerfumes.filter(item => item !== name);
            }
        }

        function sendOrder() {
            let phone = "+201109138404"
            let message = `مرحباً، أريد طلب بوكس AURA بالعطور التالية: ${selectedPerfumes.join(', ')}`;
            let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
